# The SITE Worker — squidbay.ai's static surface.
#
# This file did not exist until 2026-08-11. The Worker was real and serving, but its
# configuration lived only in whatever a human typed the last time they ran wrangler by
# hand, which is why marketplace#19 and #20 could merge in the morning and still not be
# on the site by the afternoon. Config in the repo is half of "merge = ship"; the other
# half is .github/workflows/deploy.yml.
#
# Deployed by that workflow on push to main. Nothing here is a credential.

name = "squidbay-ai-preview"
compatibility_date = "2026-08-01"

# Until 2026-08-13 this Worker had no `main` at all — it was assets-only, so no code
# of ours ever ran and a path with no file behind it could only be a 404. That is what
# made /skill/<seller>/<slug> serve the 404 page on the live site. The script below is
# the smallest program that answers those paths; read its header before changing it.
# It lives under workers/ because .assetsignore already excludes that directory, so
# adding it here cannot publish source at https://squidbay.ai/.
main = "workers/site/index.js"

# An account ID is an identifier, not a secret — it is useless without a token, and it
# already appears in this repo (workers/squidbot-chat/wrangler.toml) for the same reason.
account_id = "d41593267b9908b65780b8904e5cd2fe"

# ── Routing is deliberately NOT declared here ────────────────────────────────────────
# squidbay.ai is bound to this Worker in the Cloudflare dashboard. Cloudflare's own
# guidance: a config that declares `routes` OVERRIDES dashboard routing on every deploy,
# and a config that declares none leaves it alone. Declaring the apex here would put the
# live domain one typo away from every merge, for no gain — Ghost owns the binding, this
# file owns the code and the assets.
# `workers_dev` is left unset for the same reason: the preview hostname
# squidbay-ai-preview.andrew-415.workers.dev is live and is named in squidbot-chat's
# ALLOWED_ORIGINS, so setting `workers_dev = false` would silently break the widget there.

[assets]
directory = "."

# The name workers/site/index.js reaches the asset server by. Cloudflare's docs are
# explicit that `binding` is only valid when a `main` script is set — it was correctly
# absent from this file while there was none, and is correct to add now that there is.
binding = "ASSETS"

# Which paths run the script BEFORE the asset server answers. The default is the
# opposite: assets win and the script is only reached when nothing matched — which is
# no use here, because /skill/<seller>/<slug> matches no asset and the 404 handling
# below would already have fired by then.
#
# This is a route-pattern array (wrangler ≥ 4.20 — verified against Cloudflare's
# current docs, not from memory), so it is scoped to exactly one prefix rather than
# `true`, which would put every request on squidbay.ai through our code.
#
# /agent/* is deliberately NOT here. The /agent/<name> vanity route collides in path
# space with the real agent/ folder in this repo, and that needs its own analysis
# before anything routes it.
#
# Note the pattern needs the trailing slash to match: `/skill` itself does not match
# `/skill/*`, so the bare page keeps being served by the asset server, untouched.
# `/agent` and `/agent/` are both listed for exactly the reason in the note above: the
# bare path does not match the slash pattern, and the retired page has to redirect
# whichever form a visitor or an old link arrives with.
run_worker_first = [ "/skill/*", "/agent", "/agent/" ]

# Both values below were verified against the live site on 2026-08-11 before being
# written down. They are stated explicitly so that a deploy cannot quietly change the
# URL shape the site already has:
#   /foo.html  → 307 → /foo      /foo → foo.html      / → index.html
html_handling = "auto-trailing-slash"
# A missing path serves 404.html WITH a 404 status, rather than 200-ing a shell.
# marketplace#19 landed that honest 404 on purpose; this keeps it.
not_found_handling = "404-page"
