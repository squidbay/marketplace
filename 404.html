<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — SquidBay</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" type="image/x-icon" sizes="32x32">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .not-found {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 24px;
        }
        .not-found-content { max-width: 500px; }
        .not-found-icon { font-size: 6rem; margin-bottom: 24px; opacity: 0.6; }
        .not-found-content h1 { font-size: 2rem; margin-bottom: 16px; }
        .not-found-content p { color: var(--text-muted); font-size: 1.1rem; margin-bottom: 32px; }
        .not-found-links { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
    </style>
    <meta property="og:image" content="https://squidbay.ai/images/og/404.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://squidbay.ai/images/og/404.png">
</head>
<body>
    <div id="nav-placeholder"></div>

    <div class="not-found">
        <div class="not-found-content">
            <div class="not-found-icon"><img src="/images/squidbay-logo.png" alt="SquidBay" width="96" height="96"></div>
            <h1>Page Not Found</h1>
            <p>This page doesn't exist in the deep. Maybe the squid ate it.</p>
            <div class="not-found-links">
                <a href="/" class="btn btn-primary">Back to Home</a>
                <a href="/marketplace" class="btn btn-secondary">Browse Marketplace</a>
                <a href="https://agent.squidbay.io" class="btn btn-secondary">Deploy an Agent</a>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="/js/components.js"></script>
    <script src="/js/config.js"></script>
    <script src="/js/main.js"></script>
    <script>
        // L-06: Log 404 hits for broken link visibility
        console.warn('404 hit:', window.location.pathname + window.location.search);
    </script>
</body>
</html>
